# Publishes a Foundry release when module.json on main has a version with no release yet.
# The release is tagged v<version>; assets are module.json (the manifest Foundry installs from) and module.zip.
# Bump "version" and "download" in module.json, add the README changelog section, push to main.
name: Release

on:
  push:
    branches: [main]
    paths: [module.json, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./module.json').version")
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/module.zip"
          if [ "$(node -p "require('./module.json').download")" != "$DL" ]; then
            echo "module.json download should be $DL"; exit 1
          fi

      - name: Run parser tests
        if: steps.ver.outputs.skip != 'true'
        run: node --test tests/*.test.mjs

      - name: Build module.zip
        if: steps.ver.outputs.skip != 'true'
        run: git archive --format=zip -o module.zip HEAD -- . ':!.gitignore' ':!.github'

      - name: Release notes from the README changelog
        if: steps.ver.outputs.skip != 'true'
        run: |
          python3 - "${{ steps.ver.outputs.version }}" > release-notes.md <<'EOF'
          import sys
          v = sys.argv[1]
          s = open('README.md', encoding='utf-8').read()
          part = s.split(f'# v {v}\n', 1)
          sec = part[1].split('\n# v ', 1)[0].strip() if len(part) == 2 else ''
          repo = 'https://github.com/geek-io/shadowrunimporterfoundry'
          print('Import NPCs, critters, spirits, sprites, vehicles, gear, weapons, spells, powers, qualities and more into the Shadowrun 5th Edition system from JSON, plain text and PDF. Works with Foundry VTT v13 and v14.\n')
          print('**Install:** in Foundry, go to *Add-on Modules → Install Module* and paste this manifest URL:\n')
          print(f'```\n{repo}/releases/latest/download/module.json\n```\n')
          if sec:
              print(f'## What\'s new in v{v}\n')
              print(sec)
          print('\nThe full changelog is in the README.')
          EOF

      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.skip != 'true'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.ver.outputs.tag }}
          body_path: release-notes.md
          files: |
            module.json
            module.zip
